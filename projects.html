<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CC Warhammer - Our Projects and Game Titles">
    <title>Projects - CC Warhammer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">
                    <img src="images/logo/logo.png" alt="CC Warhammer" class="logo-image">
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="projects.html" data-en="Projects" data-zh="项目" data-ko="프로젝트">Projects</a></li>
                <li><a href="services.html" data-en="Services" data-zh="服务" data-ko="서비스">Services</a></li>
                <li><a href="contact.html" data-en="Contact Us" data-zh="联系我们" data-ko="문의하기">Contact Us</a></li>
            </ul>
            <div class="lang-switch">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="zh">中文</button>
                <button class="lang-btn" data-lang="ko">한국어</button>
            </div>
            <button class="mobile-menu-toggle" aria-label="Toggle navigation menu">
                <span class="hamburger"></span>
            </button>
        </nav>
    </header>

    <main>
        <section id="portfolio" class="portfolio">
            <div class="container">
                <h2 data-en="Our Portfolio" data-zh="我们的作品集" data-ko="포트폴리오">Our Portfolio</h2>
                <!-- Portfolio Rectangles -->
                <div class="portfolio-rectangles">
                    <div class="portfolio-rectangle-item active" data-portfolio="deltaForce">
                        <img src="images/portfolio/portfolio_01.png" alt="Delta Force">
                    </div>
                    <div class="portfolio-rectangle-item" data-portfolio="cfhd">
                        <img src="images/portfolio/portfolio_02.png" alt="CrossFire HD">
                    </div>
                </div>

                <!-- Portfolio Slideshow Gallery -->
                <div class="portfolio-gallery">
                    <div class="portfolio-gallery-slideshow" id="portfolio-slideshow">
                        <div class="portfolio-gallery-slide active"></div>
                        <div class="portfolio-gallery-slide"></div>
                    </div>
                    <button class="portfolio-gallery-nav portfolio-gallery-prev" aria-label="Previous image">
                        <span>&lt;</span>
                    </button>
                    <button class="portfolio-gallery-nav portfolio-gallery-next" aria-label="Next image">
                        <span>&gt;</span>
                    </button>
                    <div class="portfolio-gallery-message" id="gallery-message">
                        <p data-en="Upload images to display gallery" data-zh="上传图片以显示画廊" data-ko="갤러리를 표시하려면 이미지를 업로드하세요">Upload images to display gallery</p>
                    </div>
                </div>

                <h3 data-en="Game Titles We've Worked On" data-zh="我们参与的游戏作品" data-ko="참여한 게임 타이틀" class="game-titles-heading">Game Titles We've Worked On</h3>
                <div class="game-titles-carousel">
                    <div class="game-titles-grid">
                        <div class="game-title-item">
                            <img src="images/game-titles/title1.png" alt="Game Title 1">
                        </div>
                        <div class="game-title-item">
                            <img src="images/game-titles/title2.png" alt="Game Title 2">
                        </div>
                        <div class="game-title-item">
                            <img src="images/game-titles/title3.png" alt="Game Title 3">
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Character Showcase Section -->
    <div class="character-showcase">
        <div class="character-showcase-container">
            <img src="images/footer_left.png" alt="Character Left" class="showcase-character showcase-character-left">
            <img src="images/footer_right.png" alt="Character Right" class="showcase-character showcase-character-right">
        </div>
    </div>

    <footer>
        <div class="container">
            <p data-en="© 2024 CC Warhammer. All rights reserved." data-zh="© 2024 CC Warhammer。保留所有权利。" data-ko="© 2024 CC Warhammer. 모든 권리 보유.">&copy; 2024 CC Warhammer. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
